; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:release]
platform = espressif32 @ 6.5.0
board = um_pros3
lib_ldf_mode = deep
framework = arduino
upload_speed = 1500000
upload_protocol = esp-builtin

# In platformio.ini, add:
#upload_flags = 
#    --before=default_reset
#    --after=hard_reset


monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
board_build.partitions = partitions/ota_spiffs_16MB.csv
extra_scripts = pre:pre-build-script.py
build_type = release
lib_deps = 
	https://github.com/scuba-hacker/AsyncElegantOTA
	https://github.com/me-no-dev/ESPAsyncWebServer
	https://github.com/scuba-hacker/M5StickC-Plus#UseExternalTFT_eSPI
      https://github.com/scuba-hacker/TFT_eSPI#PushImageScaled
	https://github.com/scuba-hacker/Telemetry-Pipeline
	https://github.com/marian-craciunescu/ESP32Ping
	https://github.com/scuba-hacker/TinyGPSPlus#MercatorFunctions
	mlesniew/PicoMQTT @ 1.3.0
	bblanchon/ArduinoJson @ 7.4.2
	https://github.com/scuba-hacker/WebSerial
	https://github.com/witnessmenow/Universal-Arduino-Telegram-Bot
	https://github.com/scuba-hacker/navigation-waypoints
	unexpectedmaker/UMS3 Helper@^2.0.0
	olikraus/U8g2 @ 2.36.12
	https://github.com/scuba-hacker/async-mqtt-client

	adafruit/Adafruit SSD1327@^1.0.4
	lovyan03/LovyanGFX@^1.2.7
build_unflags = -std=gnu++11
build_flags = 
	-std=gnu++17
	-mfix-esp32-psram-cache-issue
	-D BOARD_HAS_PSRAM
	-D DISABLE_ALL_LIBRARY_WARNINGS
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D ARDUINO_USB_MUX_DEFAULT=1

; This allows a larger web socket message queue (up from 32) in AsyncWebSocket.h/.cpp
; This was needed because the web socket for the logs page was blowing up when doing lots of diagnostics messages
	-D WS_MAX_QUEUED_MESSAGES=256

; keep this commented out config for debugging later
