<!DOCTYPE html>
<html>
<head>
    <title>Lemon IO - Serial Console</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { 
            font-family: monospace; 
            margin: 0; 
            padding: 20px; 
            background: #1e1e1e; 
            color: #d4d4d4; 
        }
        .container {
            max-width: none;
            margin: 0 auto;
            padding: 0 20px;
            width: 100%;
        }
        h1 { 
            color: #569cd6; 
            text-align: center; 
            margin-bottom: 20px; 
        }
        .controls { 
            margin-bottom: 20px; 
            text-align: center; 
        }
        .command-controls {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
            max-width: fit-content;
            margin-left: auto;
            margin-right: auto;
        }
        .command-input {
            width: 250px;
            padding: 8px;
            font-family: monospace;
            border: 1px solid #444;
            background: #2d2d2d;
            color: #d4d4d4;
            border-radius: 4px;
        }
        .command-dropdown {
            padding: 8px;
            font-family: monospace;
            border: 1px solid #444;
            background: #2d2d2d;
            color: #d4d4d4;
            border-radius: 4px;
            min-width: 150px;
        }
        button {
            background: #0078d4;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 0 10px;
            border-radius: 4px;
            cursor: pointer;
            font-family: monospace;
        }
        button:hover {
            background: #106ebe;
        }
        .btn-write-bytes {
            background: #2d5016;
            color: white;
        }
        .btn-write-bytes:hover {
            background: #1e3810;
        }
        .btn-send {
            background: #2d5016;
            color: white;
        }
        .btn-send:hover {
            background: #1e3810;
        }
        .btn-clear {
            background: #f39c12;
            color: white;
        }
        .btn-clear:hover {
            background: #e67e22;
        }
        .btn-copy-log {
            background: #f1c40f;
            color: #000;
        }
        .btn-copy-log:hover {
            background: #f39c12;
            color: #000;
        }
        .btn-scroll {
            padding: 4px 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-top: 8px;
        }
        .btn-scroll img {
            width: 28px;
            height: 28px;
        }
        button:disabled {
            background: #666;
            cursor: not-allowed;
        }
        .shortcut-controls {
            margin-bottom: 20px;
            text-align: center;
        }
        .btn-stats {
            background: #2ecc71;
            color: white;
        }
        .btn-stats:hover {
            background: #27ae60;
        }
        .btn-reboot {
            background: #e74c3c;
            color: white;
        }
        .btn-reboot:hover {
            background: #c0392b;
        }
        .btn-update {
            background: #f39c12;
            color: white;
        }
        .btn-update:hover {
            background: #e67e22;
        }
        .btn-reload {
            background: #e91e63;
            color: white;
        }
        .btn-reload:hover {
            background: #c2185b;
        }
        .btn-text-size {
            background: #9c27b0;
            color: white;
            padding: 8px 12px;
            font-weight: bold;
            font-size: 16px;
        }
        .btn-text-size:hover {
            background: #7b1fa2;
        }
        #console {
            background: #000;
            border: 1px solid #444;
            padding: 10px;
            height: 500px;
            width: 80%;
            min-height: 200px;
            min-width: 300px;
            max-height: 80vh;
            max-width: 90vw;
            overflow: auto;
            font-size: 10px;
            line-height: 1.4;
            white-space: pre;
            word-wrap: normal;
            resize: both;
            box-sizing: border-box;
            margin: 20px auto;
            display: block;
            position: relative;
        }
        /* Resize handles for console edges */
        .console-resize-left,
        .console-resize-right,
        .console-resize-bottom {
            position: absolute;
            background: rgba(68, 68, 68, 0.3);
            z-index: 10;
            transition: background-color 0.2s;
        }
        .console-resize-left:hover,
        .console-resize-right:hover,
        .console-resize-bottom:hover {
            background: rgba(68, 68, 68, 0.6);
        }
        /* Left edge resize handle */
        .console-resize-left {
            left: -8px;
            top: 10%;
            bottom: 10%;
            width: 16px;
            cursor: ew-resize;
            border-radius: 0 8px 8px 0;
        }
        /* Right edge resize handle */
        .console-resize-right {
            right: -8px;
            top: 10%;
            bottom: 10%;
            width: 16px;
            cursor: ew-resize;
            border-radius: 8px 0 0 8px;
        }
        /* Bottom edge resize handle */
        .console-resize-bottom {
            bottom: -8px;
            left: 10%;
            right: 10%;
            height: 16px;
            cursor: ns-resize;
            border-radius: 8px 8px 0 0;
        }
        #console::-webkit-scrollbar {
            width: 20px;
            height: 20px;
        }
        #console::-webkit-scrollbar-track {
            background: #333;
        }
        #console::-webkit-scrollbar-thumb {
            background: #666;
            border-radius: 6px;
        }
        #console::-webkit-scrollbar-thumb:hover {
            background: #888;
        }
        #console::-webkit-scrollbar-corner {
            background: #333;
        }

        /* Responsive centering for different screen sizes */
        @media (max-width: 768px) {
            #console {
                width: 95%;
                min-width: 280px;
            }
            .container {
                padding: 0 10px;
            }
        }

        @media (min-width: 1400px) {
            #console {
                width: 70%;
            }
        }

        @media (min-width: 1800px) {
            #console {
                width: 60%;
            }
        }
        .status { 
            margin-top: 10px; 
            padding: 10px; 
            text-align: center; 
            border-radius: 4px; 
        }
        .connected { 
            background: #164e24; 
            color: #4fc3f7; 
        }
        .disconnected { 
            background: #4e1616; 
            color: #f44336; 
        }
        .timestamp { 
            color: #999; 
        }
        .ota-banner {
            background: #ff6b35;
            color: white;
            padding: 15px;
            text-align: center;
            border-radius: 4px;
            margin-bottom: 20px;
            font-weight: bold;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Lemon IO - Serial Console</h1>
        <div class="shortcut-controls">
            <button class="btn-reload" onclick="reloadPage()">Reload</button>
            <button class="btn-stats" onclick="goToStats()">Stats</button>
            <button class="btn-reboot" onclick="confirmReboot()">Reboot</button>
            <button class="btn-update" onclick="goToUpdate()">Update</button>
        </div>
        <div class="controls">
            <button class="btn-clear" onclick="clearConsole()">Clear</button>
            <button onclick="saveConsole()">Save Log</button>
            <button class="btn-scroll" onclick="scrollToTop()">
                <img src="/arrow-up.svg" alt="Scroll to top">
            </button>
            <button class="btn-scroll" onclick="scrollToBottom()">
                <img src="/arrow-down.svg" alt="Scroll to bottom">
            </button>
            <button onclick="toggleAutoScroll()" id="autoScrollBtn">Auto-scroll: OFF</button>
            <button class="btn-copy-log" onclick="copyConsole()" id="copyBtn" title="Copy">Copy Log</button>
        </div>
        <div class="command-controls">
            <input type="text" id="messageInput" class="command-input" placeholder="Type custom command">
            <button class="btn-write-bytes" onclick="sendInputMessage()">Write Bytes</button>
            <select id="commandDropdown" class="command-dropdown">
                <option value="">-- Select Command --</option>
                <option value="S">Show System Status</option>
                <option value="F">Show Flash Persistence Setting</option>
                <option value="R">Factory Reset Flash Buffer (DESTRUCTIVE)</option>
                <option value="X">Prepare Safe Shutdown (flush + lock flash)</option>
                <option value="D">Disconnect WiFi (WARNING: kills this console; recover with C via USB)</option>
                <option value="C">Connect WiFi (Simulate Online)</option>
                <option value="H">Show Help</option>
                <option value="POST">Run Power-On Self Test</option>
                <option value="DEEP">Run Deep Sector Validation</option>
                <option value="STRESS">Run Stress Test (100 records)</option>
                <option value="RECOVERY">Run Power-Loss Recovery Test</option>
            </select>
            <button class="btn-send" onclick="sendDropdownMessage()">Send</button>
            <button class="btn-text-size" onclick="decreaseTextSize()" title="Smaller Text">A-</button>
            <button class="btn-text-size" onclick="increaseTextSize()" title="Larger Text">A+</button>
        </div>
        <div id="otaBanner" class="ota-banner" style="display: none;">
            <strong>OTA MODE SHUTTING DOWN</strong><br>
            ESP-NOW communications will be restored momentarily...
        </div>
        <div id="console">
            <div class="console-resize-left"></div>
            <div class="console-resize-right"></div>
            <div class="console-resize-bottom"></div>
        </div>
        <div id="status" class="status disconnected">Disconnected</div>
    </div>

    <script>
        let ws;
        let autoScroll = false;
        let logBuffer = [];
        const MAX_LOG_BUFFER_SIZE = 100000;
        const consoleElement = document.getElementById('console');
        const status = document.getElementById('status');
        const autoScrollBtn = document.getElementById('autoScrollBtn');

        function connect() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = protocol + '//' + window.location.hostname + ':' + window.location.port + '/webserialws';

            // Close existing connection if not already closed
            if (ws && ws.readyState !== WebSocket.CLOSED) {
                ws.close();
            }

            ws = new WebSocket(wsUrl);

            ws.onopen = function() {
                status.textContent = 'Connected';
                status.className = 'status connected';
                addToConsole('=== Connected to Lemon IO Serial Console ===\n');
            };

            ws.onmessage = function(event) {
                addToConsole(event.data);
            };

            ws.onclose = function() {
                status.textContent = 'Disconnected - Reconnecting...';
                status.className = 'status disconnected';
                setTimeout(connect, 2000);
            };

            ws.onerror = function() {
                status.textContent = 'Connection Error';
                status.className = 'status disconnected';
            };
        }

        function addToConsole(data) {
            const timestamp = new Date().toLocaleTimeString();
            const timestampedData = '[' + timestamp + '] ' + data;

            // Add to buffer with size limit
            logBuffer.push(timestampedData);
            if (logBuffer.length > MAX_LOG_BUFFER_SIZE) {
                logBuffer.shift(); // Remove oldest entry
            }

            // Check current selection state and update accordingly
            checkForSelectionChange();

            // Only update console if not paused
            if (consoleElement.dataset.paused !== 'true') {
                consoleElement.textContent += timestampedData;

                if (autoScroll) {
                    consoleElement.scrollTop = consoleElement.scrollHeight;
                }
            }

            // Check for OTA shutdown sequence
            if (data.includes('OTA mode will be disabled') || data.includes('OTA mode disabled')) {
                showOtaBanner();
            }
        }

        function showOtaBanner() {
            const banner = document.getElementById('otaBanner');
            banner.style.display = 'block';
            
            // Hide banner after 10 seconds
            setTimeout(() => {
                banner.style.display = 'none';
            }, 10000);
        }

        function clearConsole() {
            consoleElement.textContent = '';

            // Force memory cleanup
            logBuffer.length = 0;  // Clear array efficiently
            logBuffer = [];        // Create new array to release old references

            // Force garbage collection hint (if available)
            if (window.gc && typeof window.gc === 'function') {
                window.gc();
            }

            // Reset paused state
            consoleElement.dataset.paused = 'false';
            consoleElement.style.borderColor = '#444';

            console.log('Console cleared - buffer reset');
        }

        // Resume updates when user deselects text
        function checkForSelectionChange() {
            const selection = window.getSelection();
            const hasSelection = selection.rangeCount > 0 && !selection.isCollapsed;
            const currentlyPaused = consoleElement.dataset.paused === 'true';

            if (hasSelection && !currentlyPaused) {
                // User just made a selection - pause updates
                consoleElement.dataset.paused = 'true';
                consoleElement.style.borderColor = '#ffa500'; // Orange border to indicate paused updates
            } else if (!hasSelection && currentlyPaused) {
                // User cleared selection - resume updates
                consoleElement.dataset.paused = 'false';
                consoleElement.style.borderColor = '#444';

                // Rebuild console content from buffer to catch up
                const maxDisplayLines = 100000;
                const linesToShow = logBuffer.length > maxDisplayLines ?
                    logBuffer.slice(-maxDisplayLines) : logBuffer;
                consoleElement.textContent = linesToShow.join('');

                if (autoScroll) {
                    consoleElement.scrollTop = consoleElement.scrollHeight;
                }
            }
        }

        function saveConsole() {
            if (logBuffer.length === 0) {
                alert('Console is empty - nothing to save');
                return;
            }

            try {
                const content = logBuffer.join('');
                const blob = new Blob([content], { type: 'text/plain' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'lemon-io-console-' + new Date().toISOString().replace(/[:.]/g, '-') + '.txt';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);
                console.log('Console saved with', logBuffer.length, 'entries');
            } catch (error) {
                console.error('Error saving console:', error);
                alert('Error saving console log');
            }
        }

        function scrollToTop() {
            consoleElement.scrollTop = 0;
        }

        function scrollToBottom() {
            consoleElement.scrollTop = consoleElement.scrollHeight;
        }

        function toggleAutoScroll() {
            autoScroll = !autoScroll;
            autoScrollBtn.textContent = 'Auto-scroll: ' + (autoScroll ? 'ON' : 'OFF');
        }

    async function copyConsole() {
        const text = consoleElement.textContent || '';
        if (!text) {
            alert('Console is empty');
            return;
        }

        // Prefer modern Clipboard API (requires HTTPS or localhost)
        if (navigator.clipboard && window.isSecureContext) {
            try {
                await navigator.clipboard.writeText(text);
                flashStatus('Copied console to clipboard', true);
                return;
            } catch (e) {
                // fall through to legacy path
            }
        }

        // Legacy fallback: temporary textarea + execCommand
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        try {
            const ok = document.execCommand('copy');
            flashStatus(ok ? 'Copied console to clipboard' : 'Copy failed', ok);
        } catch {
            alert('Copy not supported in this browser');
        } finally {
            document.body.removeChild(ta);
        }
    }

    // Small helper to show a quick success/fail message in the status bar
    function flashStatus(msg, success) {
        const prev = status.textContent;
        const prevClass = status.className;
        status.textContent = msg;
        status.className = 'status ' + (success ? 'connected' : 'disconnected');
        setTimeout(() => {
            status.textContent = prev;
            status.className = prevClass;
        }, 1500);
    }

    function sendInputMessage() {
            const messageInput = document.getElementById('messageInput');
            const message = messageInput.value.trim();
            
            if (message && ws && ws.readyState === WebSocket.OPEN) {
                ws.send(message);
                addToConsole('>>> Sent (input): ' + message + '\n');
                messageInput.value = '';
            } else if (!message) {
                alert('Please enter a message');
            } else {
                alert('WebSocket not connected');
            }
        }

        function sendDropdownMessage() {
            const dropdown = document.getElementById('commandDropdown');
            const command = dropdown.value;

            // Guard the commands that destroy data or sever this console.
            if (command === 'R' &&
                !confirm('Factory reset erases ALL stored telemetry in the flash ring buffer. Continue?')) {
                return;
            }
            if (command === 'D' &&
                !confirm('Disconnecting WiFi will DISCONNECT THIS CONSOLE and the blocked state persists across reboots. ' +
                         'Recovery requires sending C over USB serial. Continue?')) {
                return;
            }

            if (command && ws && ws.readyState === WebSocket.OPEN) {
                ws.send(command);
                addToConsole('>>> Sent (dropdown): ' + command + '\n');
                // Don't clear dropdown selection - keep it for repeated use
            } else if (!command) {
                alert('Please select a command from dropdown');
            } else {
                alert('WebSocket not connected');
            }
        }

        // Custom resize functionality for console edges
        function initCustomResize() {
            const consoleEl = document.getElementById('console');
            const leftHandle = document.querySelector('.console-resize-left');
            const rightHandle = document.querySelector('.console-resize-right');
            const bottomHandle = document.querySelector('.console-resize-bottom');

            let isResizing = false;
            let currentHandle = null;
            let startX, startY, startWidth, startHeight;

            function startResize(e, handleType) {
                isResizing = true;
                currentHandle = handleType;
                startX = e.clientX;
                startY = e.clientY;
                startWidth = parseInt(window.getComputedStyle(consoleEl).width, 10);
                startHeight = parseInt(window.getComputedStyle(consoleEl).height, 10);
                e.preventDefault();
                e.stopPropagation();
            }

            // Left edge resize
            if (leftHandle) {
                leftHandle.addEventListener('mousedown', function(e) {
                    startResize(e, 'left');
                });
            }

            // Right edge resize
            if (rightHandle) {
                rightHandle.addEventListener('mousedown', function(e) {
                    startResize(e, 'right');
                });
            }

            // Bottom edge resize
            if (bottomHandle) {
                bottomHandle.addEventListener('mousedown', function(e) {
                    startResize(e, 'bottom');
                });
            }

            document.addEventListener('mousemove', function(e) {
                if (!isResizing) return;

                if (currentHandle === 'left') {
                    const newWidth = startWidth - (e.clientX - startX);
                    if (newWidth >= 300) {
                        consoleEl.style.width = newWidth + 'px';
                    }
                } else if (currentHandle === 'right') {
                    const newWidth = startWidth + (e.clientX - startX);
                    if (newWidth >= 300) {
                        consoleEl.style.width = newWidth + 'px';
                    }
                } else if (currentHandle === 'bottom') {
                    const newHeight = startHeight + (e.clientY - startY);
                    if (newHeight >= 200) {
                        consoleEl.style.height = newHeight + 'px';
                    }
                }
            });

            document.addEventListener('mouseup', function() {
                if (isResizing) {
                    isResizing = false;
                    currentHandle = null;
                    // Save the new size to cookies
                    saveConsoleSize();
                }
            });
        }

        // Allow Enter key to send input message
        document.addEventListener('DOMContentLoaded', function() {
            const messageInput = document.getElementById('messageInput');
            messageInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    sendInputMessage();
                }
            });

            // Listen for selection changes to resume updates when text is deselected
            document.addEventListener('selectionchange', () => {
                // Small delay to ensure selection state has settled
                setTimeout(checkForSelectionChange, 10);
            });

            // Also check on mouse/key events that might change selection
            consoleElement.addEventListener('mouseup', () => setTimeout(checkForSelectionChange, 10));
            consoleElement.addEventListener('keyup', () => setTimeout(checkForSelectionChange, 10));

            // Initialize paused state
            consoleElement.dataset.paused = 'false';

            // Restore console size from cookies
            restoreConsoleSize();

            // Restore text size from cookies
            restoreTextSize();

            // Initialize custom resize functionality
            initCustomResize();

            // Add resize observer to save size when user resizes console
            if (window.ResizeObserver) {
                const resizeObserver = new ResizeObserver((entries) => {
                    // Debounce the save to avoid too many cookie writes during resize
                    clearTimeout(window.resizeSaveTimeout);
                    window.resizeSaveTimeout = setTimeout(saveConsoleSize, 500);
                });
                resizeObserver.observe(consoleElement);
            } else {
                // Fallback for older browsers - use mutation observer
                const observer = new MutationObserver((mutations) => {
                    mutations.forEach((mutation) => {
                        if (mutation.type === 'attributes' &&
                            (mutation.attributeName === 'style')) {
                            clearTimeout(window.resizeSaveTimeout);
                            window.resizeSaveTimeout = setTimeout(saveConsoleSize, 500);
                        }
                    });
                });
                observer.observe(consoleElement, { attributes: true, attributeFilter: ['style'] });
            }
        });

        // Text size control functions
        const textSizes = [10, 12, 14, 16, 18, 20, 24, 28];
        let currentTextSizeIndex = 0; // Start at smallest size (10px)

        function increaseTextSize() {
            if (currentTextSizeIndex < textSizes.length - 1) {
                currentTextSizeIndex++;
                applyTextSize();
                saveTextSize();
                console.log('Text size increased to:', textSizes[currentTextSizeIndex] + 'px');
            }
        }

        function decreaseTextSize() {
            if (currentTextSizeIndex > 0) {
                currentTextSizeIndex--;
                applyTextSize();
                saveTextSize();
                console.log('Text size decreased to:', textSizes[currentTextSizeIndex] + 'px');
            }
        }

        function applyTextSize() {
            const fontSize = textSizes[currentTextSizeIndex];
            consoleElement.style.fontSize = fontSize + 'px';
        }

        function saveTextSize() {
            setCookie('consoleTextSize', currentTextSizeIndex);
        }

        function restoreTextSize() {
            const savedIndex = getCookie('consoleTextSize');
            if (savedIndex !== null) {
                currentTextSizeIndex = parseInt(savedIndex);
                // Ensure index is within valid range
                if (currentTextSizeIndex < 0 || currentTextSizeIndex >= textSizes.length) {
                    currentTextSizeIndex = 0; // Default to smallest
                }
            } else {
                currentTextSizeIndex = 0; // Default to smallest size
            }
            applyTextSize();
            console.log('Text size restored to:', textSizes[currentTextSizeIndex] + 'px');
        }

        // Cookie functions for console size
        function setCookie(name, value, days = 365) {
            const expires = new Date();
            expires.setTime(expires.getTime() + (days * 24 * 60 * 60 * 1000));
            document.cookie = name + '=' + value + ';expires=' + expires.toUTCString() + ';path=/';
        }

        function getCookie(name) {
            const nameEQ = name + '=';
            const ca = document.cookie.split(';');
            for (let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) === ' ') c = c.substring(1, c.length);
                if (c.indexOf(nameEQ) === 0) return c.substring(nameEQ.length, c.length);
            }
            return null;
        }

        function saveConsoleSize() {
            const consoleElement = document.getElementById('console');
            const width = consoleElement.offsetWidth;
            const height = consoleElement.offsetHeight;
            setCookie('consoleWidth', width);
            setCookie('consoleHeight', height);
            console.log('Console size saved:', width + 'x' + height);
        }

        function restoreConsoleSize() {
            const savedWidth = getCookie('consoleWidth');
            const savedHeight = getCookie('consoleHeight');

            if (savedWidth && savedHeight) {
                const consoleElement = document.getElementById('console');
                consoleElement.style.width = savedWidth + 'px';
                consoleElement.style.height = savedHeight + 'px';
                console.log('Console size restored:', savedWidth + 'x' + savedHeight);
            }
        }

        // Shortcut button functions
        function goToStats() {
            window.location.href = '/stats';
        }

        function confirmReboot() {
            if (confirm('Are you sure you want to reboot the device?')) {
                fetch('/reboot', { method: 'GET' })
                    .then(() => {
                        alert('Reboot command sent. Device will restart shortly.');
                    })
                    .catch(error => {
                        console.error('Error sending reboot command:', error);
                        alert('Error sending reboot command');
                    });
            }
        }

        function goToUpdate() {
            window.location.href = '/update';
        }

        let autoRetryInterval = null;
        let isAutoRetrying = false;
        let retryCount = 0;

        function reloadPage() {
            console.log('reloadPage() called, isAutoRetrying:', isAutoRetrying);

            if (isAutoRetrying) {
                console.log('Stopping auto-retry');
                stopAutoRetry();
                return;
            }

            console.log('Starting auto-retry');
            startAutoRetry();
        }

        function startAutoRetry() {
            console.log('startAutoRetry() called');

            // Store retry state in localStorage (more persistent than sessionStorage)
            localStorage.setItem('autoRetryEnabled', 'true');
            localStorage.setItem('autoRetryStartTime', Date.now().toString());

            // Initialize retry count
            retryCount = 0;
            localStorage.setItem('retryCount', retryCount.toString());

            isAutoRetrying = true;
            updateReloadButton();

            console.log('Auto-retry enabled, button should be orange now');

            // Start the retry interval immediately
            console.log('Setting up 2-second interval');
            autoRetryInterval = setInterval(() => {
                retryCount++;
                localStorage.setItem('retryCount', retryCount.toString());
                console.log('Interval fired - attempting reload #' + retryCount);
                updateReloadButton(); // Update button with new count
                attemptReload();
            }, 2000);

            // Also do immediate first reload after short delay to show button change
            setTimeout(() => {
                retryCount++;
                localStorage.setItem('retryCount', retryCount.toString());
                console.log('Initial reload attempt #' + retryCount);
                updateReloadButton(); // Update button with new count
                attemptReload();
            }, 500);
        }

        function stopAutoRetry() {
            console.log('stopAutoRetry() called');

            // Clear retry state
            localStorage.removeItem('autoRetryEnabled');
            localStorage.removeItem('autoRetryStartTime');
            localStorage.removeItem('lastReloadAttempt');
            localStorage.removeItem('retryCount');

            if (autoRetryInterval) {
                console.log('Clearing interval');
                clearInterval(autoRetryInterval);
                autoRetryInterval = null;
            }

            isAutoRetrying = false;
            retryCount = 0;
            updateReloadButton();

            console.log('Auto-retry stopped, button should be pink now');
        }

        function attemptReload() {
            console.log('attemptReload() - reloading page now');

            // Store attempt time before reload
            localStorage.setItem('lastReloadAttempt', Date.now().toString());

            // Force reload from server
            window.location.reload(true);
        }

        function updateReloadButton() {
            console.log('updateReloadButton() called, isAutoRetrying:', isAutoRetrying, 'retryCount:', retryCount);

            const reloadBtn = document.querySelector('.btn-reload');
            if (!reloadBtn) {
                console.error('Reload button not found!');
                return;
            }

            if (isAutoRetrying) {
                if (retryCount > 0) {
                    reloadBtn.textContent = `Stop Auto-Retry (${retryCount})`;
                    reloadBtn.title = `Auto-retrying every 2 seconds. Attempt #${retryCount}. Click to stop.`;
                } else {
                    reloadBtn.textContent = 'Stop Auto-Retry';
                    reloadBtn.title = 'Auto-retrying every 2 seconds. Click to stop.';
                }
                reloadBtn.style.background = '#ff5722';
                console.log('Button updated to ORANGE with retry count:', retryCount);
            } else {
                reloadBtn.textContent = 'Reload';
                reloadBtn.style.background = '#e91e63';
                reloadBtn.title = 'Click to reload with auto-retry';
                console.log('Button updated to PINK (Reload)');
            }
        }

        // Check if we should resume auto-retry after page load
        function checkResumeAutoRetry() {
            console.log('checkResumeAutoRetry() called');

            const autoRetryEnabled = localStorage.getItem('autoRetryEnabled');
            const startTime = localStorage.getItem('autoRetryStartTime');

            console.log('autoRetryEnabled from storage:', autoRetryEnabled);
            console.log('startTime from storage:', startTime);

            if (autoRetryEnabled === 'true' && startTime) {
                const now = Date.now();
                const timeSinceStart = now - parseInt(startTime);

                console.log(`Auto-retry was active. Time since start: ${timeSinceStart}ms`);

                // If less than 60 seconds since start, resume auto-retry
                if (timeSinceStart < 60000) {
                    console.log('Resuming auto-retry after page load');

                    // Wait a bit to see if page loads successfully
                    setTimeout(() => {
                        // Check if WebSocket is connected (page loaded successfully)
                        if (ws && ws.readyState === WebSocket.OPEN) {
                            console.log('WebSocket connected - page loaded successfully, stopping auto-retry');
                            stopAutoRetry();
                        } else {
                            console.log('WebSocket not connected - resuming auto-retry');
                            resumeAutoRetry();
                        }
                    }, 2000);
                } else {
                    console.log('Auto-retry timeout reached (60s), stopping');
                    stopAutoRetry();
                }
            } else {
                console.log('No auto-retry state found, normal operation');
            }
        }

        function resumeAutoRetry() {
            console.log('resumeAutoRetry() called');

            // Restore retry count from localStorage
            const storedRetryCount = localStorage.getItem('retryCount');
            if (storedRetryCount) {
                retryCount = parseInt(storedRetryCount);
                console.log('Restored retry count:', retryCount);
            } else {
                retryCount = 0;
            }

            isAutoRetrying = true;
            updateReloadButton();

            // Resume the retry interval
            autoRetryInterval = setInterval(() => {
                retryCount++;
                localStorage.setItem('retryCount', retryCount.toString());
                console.log('Resumed interval fired - attempting reload #' + retryCount);
                updateReloadButton(); // Update button with new count
                attemptReload();
            }, 2000);
        }



        // Auto-connect on load
        connect();

        // Check if we need to resume auto-retry after page load
        checkResumeAutoRetry();

        // Cleanup WebSocket connection when page unloads
        function closeWebSocket() {
            if (ws) {
                console.log('Closing WebSocket, state:', ws.readyState);
                ws.close(1000, 'Page closing');
                ws = null;
            }
        }
        window.addEventListener('beforeunload', closeWebSocket);
        window.addEventListener('pagehide', closeWebSocket);
        window.addEventListener('unload', closeWebSocket);
        window.addEventListener('visibilitychange', function() {
            if (document.hidden) closeWebSocket();
        });
    </script>
</body>
</html>
